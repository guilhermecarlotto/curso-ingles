<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Nunito Sans','Segoe UI',Arial,sans-serif" role="img" aria-label="Contáveis e incontáveis"><rect width="640" height="360" rx="26" fill="#FFF9F0"/><text x="320" y="34" font-size="22" font-weight="700" fill="#2B2D42" text-anchor="middle">Countable · uncountable</text><text x="320" y="56" font-size="14" font-weight="600" fill="#6B6F85" text-anchor="middle">dá para contar? a / an / many  ·  não dá? some / much</text><rect x="24" y="72" width="290" height="262" rx="20" fill="#DFE7FB"/><text x="169" y="102" font-size="17" font-weight="700" fill="#6C8EEB" text-anchor="middle">Countable (1, 2, 3…)</text><g transform="translate(78 160) rotate(0) scale(1.2)"><circle cx="-7" cy="0" r="14" fill="#E97B73"/><circle cx="7" cy="0" r="14" fill="#E97B73"/><path d="M0 -12 q0 -10 8 -14" fill="none" stroke="#6B4A2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 -16 q10 -8 16 0 q-8 6 -16 0z" fill="#6CBF84"/></g><g transform="translate(130 160) rotate(0) scale(1.2)"><circle cx="-7" cy="0" r="14" fill="#E97B73"/><circle cx="7" cy="0" r="14" fill="#E97B73"/><path d="M0 -12 q0 -10 8 -14" fill="none" stroke="#6B4A2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 -16 q10 -8 16 0 q-8 6 -16 0z" fill="#6CBF84"/></g><g transform="translate(182 160) rotate(0) scale(1.2)"><circle cx="-7" cy="0" r="14" fill="#E97B73"/><circle cx="7" cy="0" r="14" fill="#E97B73"/><path d="M0 -12 q0 -10 8 -14" fill="none" stroke="#6B4A2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 -16 q10 -8 16 0 q-8 6 -16 0z" fill="#6CBF84"/></g><g transform="translate(110 250) rotate(0) scale(1)"><path d="M0 -34 C20 -34 24 0 0 0 C-24 0 -20 -34 0 -34z" fill="#fff" stroke="#E7A94A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(190 250) rotate(0) scale(1)"><path d="M0 -34 C20 -34 24 0 0 0 C-24 0 -20 -34 0 -34z" fill="#fff" stroke="#E7A94A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="169" y="284" font-size="15" font-weight="700" fill="#2B2D42" text-anchor="middle">an apple · two eggs</text><text x="169" y="308" font-size="15" font-weight="700" fill="#6C8EEB" text-anchor="middle">How many?</text><rect x="326" y="72" width="290" height="262" rx="20" fill="#FBEBCF"/><text x="471" y="102" font-size="17" font-weight="700" fill="#E7A94A" text-anchor="middle">Uncountable (massa)</text><g transform="translate(380 190) rotate(0) scale(1)"><path d="M-20 -50 h40 l6 50 h-52z" fill="#fff" stroke="#E6DCCB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-18 -22 h36 l4 22 h-44z" fill="#CFE0FF"/></g><g transform="translate(470 190) rotate(0) scale(1)"><path d="M-26 -40 h52 l-6 40 h-40z" fill="#F3E3C8" stroke="#E6DCCB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="-14" y1="-28" x2="14" y2="-28" stroke="#E7A94A" stroke-width="4" stroke-linecap="round"/></g><g transform="translate(556 190) rotate(0) scale(1)"><rect x="-24" y="-42" width="48" height="42" rx="8" fill="#fff" stroke="#E6DCCB" stroke-width="3"/><path d="M-24 -20 q12 -10 24 0 t24 0" fill="none" stroke="#E7A94A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="380" y="216" font-size="14" font-weight="700" fill="#2B2D42" text-anchor="middle">water</text><text x="470" y="216" font-size="14" font-weight="700" fill="#2B2D42" text-anchor="middle">rice</text><text x="556" y="216" font-size="14" font-weight="700" fill="#2B2D42" text-anchor="middle">milk</text><text x="471" y="284" font-size="15" font-weight="700" fill="#2B2D42" text-anchor="middle">some water · much rice</text><text x="471" y="308" font-size="15" font-weight="700" fill="#E7A94A" text-anchor="middle">How much?</text></svg>