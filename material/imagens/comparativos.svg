<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Nunito Sans','Segoe UI',Arial,sans-serif" role="img" aria-label="Comparativos curtos e longos"><rect width="640" height="360" rx="26" fill="#FFF9F0"/><text x="320" y="34" font-size="22" font-weight="700" fill="#2B2D42" text-anchor="middle">Comparatives · comparar</text><text x="320" y="56" font-size="14" font-weight="600" fill="#6B6F85" text-anchor="middle">-er than  ·  more … than</text><rect x="24" y="72" width="592" height="120" rx="18" fill="#DFE7FB"/><g transform="translate(100 160) rotate(0) scale(1)"><rect x="-14" y="-70" width="28" height="70" rx="6" fill="#6C8EEB"/></g><g transform="translate(180 160) rotate(0) scale(1)"><rect x="-14" y="-110" width="28" height="110" rx="6" fill="#6C8EEB"/></g><text x="100" y="182" font-size="13" font-weight="700" fill="#6B6F85" text-anchor="middle">short</text><text x="180" y="182" font-size="13" font-weight="700" fill="#6B6F85" text-anchor="middle">tall</text><text x="400" y="118" font-size="26" font-weight="700" fill="#6C8EEB" text-anchor="middle">taller than</text><text x="400" y="150" font-size="16" font-weight="600" fill="#2B2D42" text-anchor="middle">He is taller than her.</text><rect x="24" y="204" width="285" height="130" rx="18" fill="#FBEBCF"/><text x="166" y="240" font-size="19" font-weight="700" fill="#2B2D42" text-anchor="middle">big → bigger</text><text x="166" y="270" font-size="19" font-weight="700" fill="#2B2D42" text-anchor="middle">fast → faster</text><text x="166" y="300" font-size="19" font-weight="700" fill="#2B2D42" text-anchor="middle">cheap → cheaper</text><rect x="331" y="204" width="285" height="130" rx="18" fill="#E9E3FA"/><text x="473" y="240" font-size="19" font-weight="700" fill="#2B2D42" text-anchor="middle">more interesting</text><text x="473" y="270" font-size="19" font-weight="700" fill="#2B2D42" text-anchor="middle">more expensive</text><text x="473" y="300" font-size="19" font-weight="700" fill="#2B2D42" text-anchor="middle">more beautiful</text><text x="473" y="322" font-size="12.5" font-weight="600" fill="#6B6F85" text-anchor="middle">palavras longas</text></svg>