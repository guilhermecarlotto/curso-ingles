<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Nunito Sans','Segoe UI',Arial,sans-serif" role="img" aria-label="Conectores usados para contar uma história"><rect width="640" height="360" rx="26" fill="#FFF9F0"/><text x="320" y="34" font-size="22" font-weight="700" fill="#2B2D42" text-anchor="middle">Conectores · and, but, because, so, or</text><rect x="24" y="66" width="592" height="46" rx="14" fill="#6CBF8422"/><circle cx="56" cy="89" r="18" fill="#6CBF84"/><text x="56" y="96" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">+</text><text x="100" y="96" font-size="22" font-weight="700" fill="#6CBF84" text-anchor="start">and</text><text x="206" y="95" font-size="13" font-weight="600" fill="#6B6F85" text-anchor="start">soma ideias</text><text x="600" y="95" font-size="15" font-weight="700" fill="#2B2D42" text-anchor="end">I woke up and had coffee.</text><rect x="24" y="120" width="592" height="46" rx="14" fill="#E97B7322"/><circle cx="56" cy="143" r="18" fill="#E97B73"/><text x="56" y="150" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">≠</text><text x="100" y="150" font-size="22" font-weight="700" fill="#E97B73" text-anchor="start">but</text><text x="206" y="149" font-size="13" font-weight="600" fill="#6B6F85" text-anchor="start">contraste</text><text x="600" y="149" font-size="15" font-weight="700" fill="#2B2D42" text-anchor="end">I’m tired, but I’m happy.</text><rect x="24" y="174" width="592" height="46" rx="14" fill="#6C8EEB22"/><circle cx="56" cy="197" r="18" fill="#6C8EEB"/><text x="56" y="204" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">←</text><text x="100" y="204" font-size="22" font-weight="700" fill="#6C8EEB" text-anchor="start">because</text><text x="206" y="203" font-size="13" font-weight="600" fill="#6B6F85" text-anchor="start">razão</text><text x="600" y="203" font-size="15" font-weight="700" fill="#2B2D42" text-anchor="end">I stayed home because it rained.</text><rect x="24" y="228" width="592" height="46" rx="14" fill="#9A83E622"/><circle cx="56" cy="251" r="18" fill="#9A83E6"/><text x="56" y="258" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">→</text><text x="100" y="258" font-size="22" font-weight="700" fill="#9A83E6" text-anchor="start">so</text><text x="206" y="257" font-size="13" font-weight="600" fill="#6B6F85" text-anchor="start">resultado</text><text x="600" y="257" font-size="15" font-weight="700" fill="#2B2D42" text-anchor="end">It rained, so I stayed home.</text><rect x="24" y="282" width="592" height="46" rx="14" fill="#E7A94A22"/><circle cx="56" cy="305" r="18" fill="#E7A94A"/><text x="56" y="312" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">/</text><text x="100" y="312" font-size="22" font-weight="700" fill="#E7A94A" text-anchor="start">or</text><text x="206" y="311" font-size="13" font-weight="600" fill="#6B6F85" text-anchor="start">escolha</text><text x="600" y="311" font-size="15" font-weight="700" fill="#2B2D42" text-anchor="end">Tea or coffee?</text></svg>