<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Nunito Sans','Segoe UI',Arial,sans-serif" role="img" aria-label="Estrutura da pergunta no passado com did"><rect width="640" height="360" rx="26" fill="#FFF9F0"/><text x="320" y="34" font-size="22" font-weight="700" fill="#2B2D42" text-anchor="middle">Passado: perguntas com DID</text><text x="320" y="56" font-size="14" font-weight="600" fill="#6B6F85" text-anchor="middle">o “did” carrega o passado; o verbo volta ao normal</text><rect x="84" y="96" width="96" height="62" rx="14" fill="#E97B73"/><text x="132" y="136" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">Did</text><rect x="190" y="96" width="86" height="62" rx="14" fill="#6C8EEB"/><text x="233" y="136" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">you</text><rect x="286" y="96" width="110" height="62" rx="14" fill="#4FB0AE"/><text x="341" y="136" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">watch</text><rect x="406" y="96" width="76" height="62" rx="14" fill="#E7A94A"/><text x="444" y="136" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">TV</text><rect x="492" y="96" width="50" height="62" rx="14" fill="#9A83E6"/><text x="517" y="136" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">?</text><text x="129" y="184" font-size="13" font-weight="600" fill="#6B6F85" text-anchor="middle">auxiliar</text><text x="224" y="184" font-size="13" font-weight="600" fill="#6B6F85" text-anchor="middle">sujeito</text><text x="332" y="184" font-size="13" font-weight="600" fill="#6B6F85" text-anchor="middle">verbo base</text><text x="430" y="184" font-size="13" font-weight="600" fill="#6B6F85" text-anchor="middle">resto</text><rect x="40" y="214" width="270" height="100" rx="18" fill="#DDF1E3"/><text x="175" y="246" font-size="22" font-weight="700" fill="#6CBF84" text-anchor="middle">Yes, I did.</text><text x="175" y="276" font-size="18" font-weight="700" fill="#2B2D42" text-anchor="middle">I watched TV.</text><text x="175" y="300" font-size="12" font-weight="600" fill="#6B6F85" text-anchor="middle">afirmativa: verbo no passado</text><rect x="330" y="214" width="270" height="100" rx="18" fill="#FDE3E0"/><text x="465" y="246" font-size="22" font-weight="700" fill="#E97B73" text-anchor="middle">No, I didn’t.</text><text x="465" y="276" font-size="18" font-weight="700" fill="#2B2D42" text-anchor="middle">I didn’t watch TV.</text><text x="465" y="300" font-size="12" font-weight="600" fill="#6B6F85" text-anchor="middle">negativa: didn’t + verbo base</text></svg>