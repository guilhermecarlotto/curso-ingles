rect x="430" y="74" width="190" height="262" rx="20" fill="#DDF1F0"/><g transform="translate(525 140) rotate(0) scale(1)"><circle cx="0" cy="-8" r="30" fill="#4FB0AE"/><path d="M-12 -8 l9 11 l16 -20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="525" y="214" font-size="28" font-weight="700" fill="#4FB0AE" text-anchor="middle">should</text><text x="525" y="242" font-size="13" font-weight="600" fill="#6B6F85" text-anchor="middle">conselho</text><rect x="442" y="262" width="166" height="42" rx="12" fill="#fff"/><text x="525" y="289" font-size="15" font-weight="700" fill="#2B2D42" text-anchor="middle">You should rest.</text><text x="320" y="352" font-size="13" font-weight="600" fill="#6B6F85" text-anchor="middle">must not · don’t have to · shouldn’t</text></svg>