<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Nunito Sans','Segoe UI',Arial,sans-serif" role="img" aria-label="Placas e imperativo"><rect width="640" height="360" rx="26" fill="#FFF9F0"/><text x="320" y="34" font-size="22" font-weight="700" fill="#2B2D42" text-anchor="middle">Placas e avisos · Imperative</text><text x="320" y="56" font-size="14" font-weight="600" fill="#6B6F85" text-anchor="middle">ordens curtas, sem “you”</text><rect x="20" y="80" width="146" height="230" rx="18" fill="#FDE3E0"/><g transform="translate(93 160) rotate(0) scale(1)"><path d="M-22 -52 L22 -52 L52 -22 L52 22 L22 52 L-22 52 L-52 22 L-52 -22z" fill="#E97B73" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="9" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">STOP</text></g><text x="93" y="262" font-size="15" font-weight="700" fill="#2B2D42" text-anchor="middle">Stop!</text><rect x="174" y="80" width="146" height="230" rx="18" fill="#DFE7FB"/><g transform="translate(247 160) rotate(0) scale(1)"><circle cx="0" cy="0" r="50" fill="#fff" stroke="#E97B73" stroke-width="9"/><text x="0" y="14" font-size="46" font-weight="700" fill="#6C8EEB" text-anchor="middle">P</text><line x1="-36" y1="36" x2="36" y2="-36" stroke="#E97B73" stroke-width="9" stroke-linecap="round"/></g><text x="247" y="262" font-size="15" font-weight="700" fill="#2B2D42" text-anchor="middle">Don’t park here.</text><rect x="328" y="80" width="146" height="230" rx="18" fill="#DDF1F0"/><g transform="translate(401 160) rotate(0) scale(1)"><rect x="-48" y="-48" width="96" height="96" rx="14" fill="#6C8EEB"/><path d="M-24 0 L16 0 M2 -16 L18 0 L2 16" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g><text x="401" y="262" font-size="15" font-weight="700" fill="#2B2D42" text-anchor="middle">Keep right.</text><rect x="482" y="80" width="146" height="230" rx="18" fill="#FBEBCF"/><g transform="translate(555 160) rotate(0) scale(1)"><circle cx="0" cy="0" r="50" fill="#fff" stroke="#E97B73" stroke-width="9"/><g transform="translate(0 20) rotate(0) scale(1.2)"><rect x="-14" y="-40" width="28" height="48" rx="6" fill="#2B2D42"/><rect x="-10" y="-34" width="20" height="32" rx="3" fill="#CFE0FF"/><circle cx="0" cy="2" r="2" fill="#fff"/></g><line x1="-36" y1="36" x2="36" y2="-36" stroke="#E97B73" stroke-width="9" stroke-linecap="round"/></g><text x="555" y="262" font-size="15" font-weight="700" fill="#2B2D42" text-anchor="middle">Turn off your phone.</text><text x="320" y="338" font-size="13" font-weight="600" fill="#6B6F85" text-anchor="middle">Verbo no começo: Stop · Don’t park · Keep right · Turn off</text></svg>