<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Nunito Sans','Segoe UI',Arial,sans-serif" role="img" aria-label="Linha do tempo com marcadores de passado"><rect width="640" height="360" rx="26" fill="#FFF9F0"/><text x="320" y="34" font-size="22" font-weight="700" fill="#2B2D42" text-anchor="middle">Past time markers</text><text x="320" y="56" font-size="14" font-weight="600" fill="#6B6F85" text-anchor="middle">o passado visto de hoje</text><line x1="50" y1="190" x2="590" y2="190" stroke="#E6DCCB" stroke-width="8" stroke-linecap="round"/><line x1="500" y1="190" x2="590" y2="190" stroke="#E97B73" stroke-width="8" stroke-linecap="round"/><path d="M590 190 L580.9955289764732 194.3496553411123 M590 190 L580.9955289764732 185.6503446588877" fill="none" stroke="#E97B73" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80" cy="190" r="16" fill="#9A83E6" stroke="#fff" stroke-width="5"/><rect x="28" y="136" width="104" height="28" rx="14" fill="#9A83E6"/><text x="80" y="155" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">last year</text><rect x="30" y="222" width="100" height="80" rx="12" fill="#9A83E622"/><text x="80" y="246" font-size="12" font-weight="700" fill="#2B2D42" text-anchor="middle">I went to</text><text x="80" y="264" font-size="12" font-weight="700" fill="#2B2D42" text-anchor="middle">Rio last</text><text x="80" y="282" font-size="12" font-weight="700" fill="#2B2D42" text-anchor="middle">year.</text><circle cx="190" cy="190" r="16" fill="#6C8EEB" stroke="#fff" stroke-width="5"/><rect x="138" y="136" width="104" height="28" rx="14" fill="#6C8EEB"/><text x="190" y="155" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">last week</text><rect x="140" y="222" width="100" height="80" rx="12" fill="#6C8EEB22"/><text x="190" y="246" font-size="12" font-weight="700" fill="#2B2D42" text-anchor="middle">We saw a</text><text x="190" y="264" font-size="12" font-weight="700" fill="#2B2D